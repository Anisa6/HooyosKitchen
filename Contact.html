<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hooyo's Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .footer-icons img{
            width: 15px;
            height:15px;
            margin:5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <main>
        <section>
            <h2>Location</h2>
            <p>205 Humber College Blvd, Etobicoke,ON,
                M9W 5L7
            </p>
        </section>
        <section>
            <h2>Contact Information</h2>
            <p>Email: contact@hooyo'skitchen.com</p>
            <p>Phone: 416-675-3111</p>
        </section>
        <section>
            <h2>Send Us a Message</h2>
            <form action="#" method="POST">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>
                
                <label for="Phone">Preferred Contact:</label>
                <input type="radio" id="Phone Number" name="Email" value="Phone Number">Phone Number
                <input type="radio" id="Email" name="Email" value="Email">Email<br>
                
                <label for="contact">Contact Information:</label><br>
                <input type="text" id="contact" name="contact" required><br><br>

                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject" required><br><br>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

                <input type="submit" value="Submit">
        </section>
    </main>
    <footer>
        <p> 2024 WEB 100 Humber College </p>
        <p> 
            <a href="https://www.facebook.com"><img src="facebook_icon.png" alt="Facebook"></a>
            <a href="https://www.instagram.com"><img src="instagram_icon.png" alt="Instagram"></a>
            <a href="https://www.twitter.com"><img src="twitter_icon.png" alt="Twitter"></a>
            </p>
</body>
</html>
